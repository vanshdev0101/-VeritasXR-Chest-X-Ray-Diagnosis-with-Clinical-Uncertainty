<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c2b49f"/></marker><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a2560f"/></marker></defs><rect width="1200" height="470" fill="#fbf6f1"/><text x="40" y="46" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="30.799999999999997" font-weight="700" fill="#524545" text-anchor="start">The merge gate — how the two pathways are combined</text><text x="40" y="70" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="18.2" font-weight="400" fill="#8a7a72" text-anchor="start">A weight predicted from the image itself, not a constant — and the only merge of four tried that is never the worst.</text><rect x="40" y="130" width="170" height="75" rx="10" fill="#f3ebe1" stroke="#c2b49f" stroke-width="1.5"/><text x="125.0" y="165.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#524545" text-anchor="middle">local  384</text><text x="125.0" y="190.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">pooled features</text><rect x="40" y="265" width="170" height="75" rx="10" fill="#f3ebe1" stroke="#c2b49f" stroke-width="1.5"/><text x="125.0" y="300.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#524545" text-anchor="middle">global  384</text><text x="125.0" y="325.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">pooled features</text><path d="M215,167 H252.5 V215 H290" stroke="#c2b49f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M215,302 H252.5 V230 H290" stroke="#c2b49f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="290" y="190" width="150" height="90" rx="10" fill="#f3ebe1" stroke="#c2b49f" stroke-width="1.5"/><text x="365.0" y="232.9" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#524545" text-anchor="middle">concat</text><text x="365.0" y="258.1" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">768</text><path d="M445,235 L485,235" stroke="#c2b49f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="485" y="190" width="170" height="90" rx="10" fill="#f3ebe1" stroke="#c2b49f" stroke-width="1.5"/><text x="570.0" y="232.9" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.594827586206897" font-weight="600" fill="#524545" text-anchor="middle">Linear 768 -&gt; 64</text><text x="570.0" y="258.1" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">ReLU</text><path d="M660,235 L700,235" stroke="#c2b49f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="700" y="190" width="150" height="90" rx="10" fill="#f3ebe1" stroke="#c2b49f" stroke-width="1.5"/><text x="775.0" y="232.9" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.502463054187192" font-weight="600" fill="#524545" text-anchor="middle">Linear 64 -&gt; 2</text><text x="775.0" y="258.1" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">softmax</text><path d="M855,235 L895,235" stroke="#c2b49f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="895" y="175" width="190" height="120" rx="10" fill="#ffca8c" stroke="#a2560f" stroke-width="1.5"/><text x="990.0" y="222.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="17.647058823529413" font-weight="600" fill="#a2560f" text-anchor="middle">w_local, w_global</text><text x="990.0" y="247.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">sum to 1, differ</text><text x="990.0" y="268.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">per image</text><path d="M990,300 L990,350" stroke="#a2560f" stroke-width="1.8" fill="none" marker-end="url(#ax)"/><rect x="850" y="350" width="280" height="80" rx="10" fill="#f3ebe1" stroke="#c2b49f" stroke-width="1.5"/><text x="990.0" y="387.9" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="13.004926108374386" font-weight="600" fill="#524545" text-anchor="middle">merged = w_l * local + w_g * global</text><text x="990.0" y="413.1" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">384 -&gt; classifier</text><text x="600" y="450" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#8a7a72" text-anchor="middle" font-style="italic">Three alternatives were trained: a fixed 50/50 average, one global learned scalar (which converged to 0.510/0.490), and concatenation. None separates by seed.</text></svg>