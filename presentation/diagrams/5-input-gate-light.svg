<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="450" viewBox="0 0 1240 450"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#8a949e"/></marker><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3261e"/></marker></defs><rect width="1240" height="450" fill="#ffffff"/><text x="40" y="46" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="30.799999999999997" font-weight="700" fill="#13161a" text-anchor="start">The input gate — refusing what the model cannot judge</text><text x="40" y="70" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5b6570" text-anchor="start">Runs on the pixels before inference, because the classifier has no way to abstain.</text><rect x="40" y="170" width="150" height="90" rx="10" fill="#eef2f6" stroke="#8a949e" stroke-width="1.5"/><text x="115.0" y="212.9" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.502463054187192" font-weight="600" fill="#13161a" text-anchor="middle">uploaded image</text><text x="115.0" y="238.1" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.54320987654321" font-weight="400" fill="#5b6570" text-anchor="middle">any PNG or JPEG</text><path d="M195,215 L235,215" stroke="#8a949e" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="235" y="170" width="170" height="90" rx="10" fill="#eef2f6" stroke="#8a949e" stroke-width="1.5"/><text x="320.0" y="202.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="20.424403183023877" font-weight="600" fill="#13161a" text-anchor="middle">greyscale 224</text><text x="320.0" y="227.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#5b6570" text-anchor="middle">16x16 pool,</text><text x="320.0" y="248.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="15.843621399176952" font-weight="400" fill="#5b6570" text-anchor="middle">z-scored per image</text><path d="M410,215 L450,215" stroke="#8a949e" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="450" y="120" width="200" height="89.6" rx="8" fill="#eef2f6" stroke="#8a949e" stroke-width="1.5"/><text x="550.0" y="152.20000000000002" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#13161a" text-anchor="middle">1 · colour</text><text x="550.0" y="177.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#5b6570" text-anchor="middle">every training film</text><text x="550.0" y="198.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#5b6570" text-anchor="middle">is greyscale</text><rect x="450" y="225" width="200" height="68.6" rx="8" fill="#eef2f6" stroke="#8a949e" stroke-width="1.5"/><text x="550.0" y="257.2" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#13161a" text-anchor="middle">2 · contrast</text><text x="550.0" y="282.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#5b6570" text-anchor="middle">blank or near-blank</text><rect x="450" y="315" width="200" height="89.6" rx="8" fill="#eef2f6" stroke="#8a949e" stroke-width="1.5"/><text x="550.0" y="347.2" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#13161a" text-anchor="middle">3 · layout</text><text x="550.0" y="372.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="15.488215488215486" font-weight="400" fill="#5b6570" text-anchor="middle">distance + correlation</text><text x="550.0" y="393.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#5b6570" text-anchor="middle">vs the mean chest</text><path d="M655,155 L700,205" stroke="#8a949e" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M655,250 L700,225" stroke="#8a949e" stroke-width="1.8" fill="none" marker-end="url(#a)"/><path d="M655,345 L700,248" stroke="#8a949e" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="700" y="185" width="150" height="80" rx="10" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.5"/><text x="775.0" y="233.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="17.77188328912467" font-weight="600" fill="#b3261e" text-anchor="middle">any one fails</text><path d="M855,200 L920,160" stroke="#b3261e" stroke-width="1.8" fill="none" marker-end="url(#ax)"/><path d="M855,250 L920,300" stroke="#8a949e" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="920" y="115" width="230" height="110.6" rx="10" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.5"/><text x="1035.0" y="147.2" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#b3261e" text-anchor="middle">refused</text><text x="1035.0" y="172.39999999999998" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#5b6570" text-anchor="middle">no verdict shown</text><text x="1035.0" y="193.39999999999998" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#5b6570" text-anchor="middle">21/22 wrong body parts</text><text x="1035.0" y="214.39999999999998" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#5b6570" text-anchor="middle">11/11 photographs</text><rect x="920" y="265" width="230" height="90" rx="10" fill="#eef2f6" stroke="#8a949e" stroke-width="1.5"/><text x="1035.0" y="297.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="19.41923774954628" font-weight="600" fill="#13161a" text-anchor="middle">passed to the model</text><text x="1035.0" y="322.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#5b6570" text-anchor="middle">costs 3.8% of genuine</text><text x="1035.0" y="343.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#5b6570" text-anchor="middle">chest radiographs</text><text x="40" y="420" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#5b6570" text-anchor="start" font-style="italic">Each cut sits at the 2nd percentile of the validation split.</text></svg>