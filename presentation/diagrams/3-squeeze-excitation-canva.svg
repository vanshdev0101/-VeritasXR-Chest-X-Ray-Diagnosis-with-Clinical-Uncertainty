<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="415" viewBox="0 0 1200 415"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#c2b49f"/></marker><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a2560f"/></marker></defs><rect width="1200" height="415" fill="#fbf6f1"/><text x="40" y="46" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="30.799999999999997" font-weight="700" fill="#524545" text-anchor="start">Squeeze-and-Excitation — channel attention at the end of each pathway</text><text x="40" y="70" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="18.2" font-weight="400" fill="#8a7a72" text-anchor="start">Lets a pathway turn its own channels up or down per image. Measured across three seeds; the effect is real on two of them.</text><rect x="40" y="160" width="150" height="90" rx="10" fill="#f3ebe1" stroke="#c2b49f" stroke-width="1.5"/><text x="115.0" y="202.9" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#524545" text-anchor="middle">384 x 7 x 7</text><text x="115.0" y="228.1" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">feature map</text><path d="M195,205 L240,205" stroke="#c2b49f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="240" y="160" width="150" height="90" rx="10" fill="#f3ebe1" stroke="#c2b49f" stroke-width="1.5"/><text x="315.0" y="192.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="15.402298850574713" font-weight="600" fill="#524545" text-anchor="middle">global avg pool</text><text x="315.0" y="217.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">-&gt; 384 numbers</text><text x="315.0" y="238.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.54320987654321" font-weight="400" fill="#8a7a72" text-anchor="middle">one per channel</text><path d="M395,205 L440,205" stroke="#c2b49f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="440" y="160" width="170" height="90" rx="10" fill="#f3ebe1" stroke="#c2b49f" stroke-width="1.5"/><text x="525.0" y="192.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.594827586206897" font-weight="600" fill="#524545" text-anchor="middle">Linear 384 -&gt; 24</text><text x="525.0" y="217.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">ReLU</text><text x="525.0" y="238.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">reduction 16</text><path d="M615,205 L655,205" stroke="#c2b49f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="655" y="160" width="170" height="90" rx="10" fill="#f3ebe1" stroke="#c2b49f" stroke-width="1.5"/><text x="740.0" y="192.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.594827586206897" font-weight="600" fill="#524545" text-anchor="middle">Linear 24 -&gt; 384</text><text x="740.0" y="217.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">sigmoid</text><text x="740.0" y="238.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">gains in (0, 1)</text><path d="M830,205 L880,205" stroke="#c2b49f" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="880" y="160" width="180" height="90" rx="10" fill="#ffca8c" stroke="#a2560f" stroke-width="1.5"/><text x="970.0" y="192.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="14.13793103448276" font-weight="600" fill="#a2560f" text-anchor="middle">per-channel multiply</text><text x="970.0" y="217.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">384 x 7 x 7</text><text x="970.0" y="238.6" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">re-weighted</text><path d="M115,255 V310 H970 V255" stroke="#c2b49f" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="540" y="332" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#8a7a72" text-anchor="middle">the original map is what gets scaled</text><text x="600" y="380" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#8a7a72" text-anchor="middle" font-style="italic">Ablation: removing SE costs accuracy on two seeds of three, so its contribution is real but not separable at this sample size.</text></svg>