<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5c6773"/></marker><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff6b5e"/></marker></defs><rect width="1200" height="410" fill="#1b1f24"/><text x="40" y="46" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="30.799999999999997" font-weight="700" fill="#e9edf2" text-anchor="start">Bottleneck block — the unit both pathways are built from</text><text x="40" y="70" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="18.2" font-weight="400" fill="#9aa5b1" text-anchor="start">Three stages per pathway, stride 2 on each, so 56x56 becomes 7x7. k is 3 in the local pathway and 7 in the global one.</text><rect x="40" y="180" width="130" height="80" rx="10" fill="#242a31" stroke="#5c6773" stroke-width="1.5"/><text x="105.0" y="217.9" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#e9edf2" text-anchor="middle">in</text><text x="105.0" y="243.1" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#9aa5b1" text-anchor="middle">C x H x W</text><path d="M175,220 L215,220" stroke="#5c6773" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="215" y="180" width="170" height="89.6" rx="10" fill="#242a31" stroke="#5c6773" stroke-width="1.5"/><text x="300.0" y="212.20000000000002" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#e9edf2" text-anchor="middle">1x1 reduce</text><text x="300.0" y="237.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#9aa5b1" text-anchor="middle">C -&gt; C_out/2</text><text x="300.0" y="258.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#9aa5b1" text-anchor="middle">BN + ReLU</text><path d="M390,220 L430,220" stroke="#5c6773" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="430" y="180" width="190" height="89.6" rx="10" fill="#3a2320" stroke="#ff6b5e" stroke-width="1.5"/><text x="525.0" y="212.20000000000002" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="20.0" font-weight="600" fill="#ff6b5e" text-anchor="middle">k x k, stride 2</text><text x="525.0" y="237.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#9aa5b1" text-anchor="middle">the only place the</text><text x="525.0" y="258.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#9aa5b1" text-anchor="middle">kernel size differs</text><path d="M625,220 L665,220" stroke="#5c6773" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="665" y="180" width="170" height="89.6" rx="10" fill="#242a31" stroke="#5c6773" stroke-width="1.5"/><text x="750.0" y="212.20000000000002" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#e9edf2" text-anchor="middle">1x1 expand</text><text x="750.0" y="237.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#9aa5b1" text-anchor="middle">-&gt; C_out</text><text x="750.0" y="258.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#9aa5b1" text-anchor="middle">BN</text><path d="M840,220 L915,220" stroke="#5c6773" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="915" y="180" width="110" height="80" rx="10" fill="#242a31" stroke="#5c6773" stroke-width="1.5"/><text x="970.0" y="228.4" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#e9edf2" text-anchor="middle">+  ReLU</text><path d="M1030,220 L1070,220" stroke="#5c6773" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="1070" y="180" width="90" height="80" rx="10" fill="#242a31" stroke="#5c6773" stroke-width="1.5"/><text x="1115.0" y="217.9" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="21.0" font-weight="600" fill="#e9edf2" text-anchor="middle">out</text><text x="1115.0" y="243.1" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="16.799999999999997" font-weight="400" fill="#9aa5b1" text-anchor="middle">C_out</text><path d="M105,265 V350 H970 V265" stroke="#5c6773" stroke-width="1.8" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="537" y="370" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#9aa5b1" text-anchor="middle">projection shortcut: 1x1 stride-2 conv + BN, because stride and width both change</text><text x="600" y="420" font-family="Inter, DejaVu Sans, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#9aa5b1" text-anchor="middle" font-style="italic">Why a bottleneck: the first version stacked three full-width kxk convolutions. At k=7 and 256 channels that one choice held 59% of a 17M-parameter model.</text></svg>